name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  glass-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: scripts/test-glass.sh

  ios-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift framing/auth tests
        run: |
          cd ios
          swiftc -o /tmp/swifttests GlassBridge/Protocol.swift GlassBridge/Framing.swift GlassBridge/Auth.swift GlassBridge/LinkState.swift Tests/main.swift
          /tmp/swifttests
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build unsigned
        run: |
          cd ios
          xcodebuild -project GlassBridge.xcodeproj -scheme GlassBridge -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          cd ios
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GlassBridge.app Payload/
          zip -qr GlassBridge-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GlassBridge-unsigned-ipa
          path: ios/GlassBridge-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [glass-tests, ios-unsigned-ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GlassBridge-unsigned-ipa
          path: dist
      - name: Generate AltStore source and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          python3 -I scripts/gen-altsource.py dist/GlassBridge-unsigned.ipa "${tag#v}" "$tag" dist/apps.json
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "GlassBridge $tag (unsigned IPA, AltStore source apps.json)"
          gh release upload "$tag" dist/GlassBridge-unsigned.ipa dist/apps.json --clobber
